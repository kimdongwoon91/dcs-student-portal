<title>대전도시과학고 문제은행 통합시스템</title>

<script>

const SUPABASE_URL  = 'https://tzgeahicdobzwstaruqm.supabase.co';
const SUPABASE_ANON_KEY = 'sb_publishable_lNcWqTIS0ZdLvXbXLmCQWQ_4iGlQG3P';

const _sb = supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);

window.storage = {
  async get(key) {
    const { data, error } = await _sb.from('kv_store').select('value').eq('key', key).maybeSingle();
    if (error) throw error;
    return data ? { value: data.value } : null;
  },
  async set(key, value) {
    const { error } = await _sb.from('kv_store').upsert({ key, value, updated_at: new Date().toISOString() }, { onConflict: 'key' });
    if (error) throw error;
  }
};

<body>
<style>
  :root{
    --rail-navy:#0B1F3A;
    --rail-blue:#1F4E8C;
    --rail-blue-light:#3E6BAF;
    --signal:#E4572E;
    --board-bg:#0F1115;
    --board-amber:#FFB100;
    --paper:#F7F5EF;
    --card:#FFFFFF;
    --ink:#16202C;
    --ink-soft:#5B6B7C;
    --line:#DDE2E8;
    --ok:#2E7D5B;
    --bad:#C23B22;
    --radius:10px;
  }
  *{box-sizing:border-box;}
  .knb-root{font-family:"Pretendard","Noto Sans KR",-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;background:var(--paper);color:var(--ink);min-height:100%;}
  .knb-top{background:var(--rail-navy);color:#fff;padding:18px 22px;display:flex;align-items:center;justify-content:space-between;gap:14px;flex-wrap:wrap;}
  .knb-brand{display:flex; align-items:center; gap:12px;}
  .knb-mark{width:38px;height:38px;border-radius:9px;background:linear-gradient(135deg,var(--rail-blue-light),var(--rail-blue));display:flex;align-items:center;justify-content:center;flex-shrink:0;padding:6px;}
  .knb-mark img{width:100%;height:100%;object-fit:contain;}
  .knb-title-block{display:flex;flex-direction:column;line-height:1.25;}
  .knb-eyebrow{font-size:11px;letter-spacing:2px;color:#9FB4D6;font-weight:600;}
  .knb-title{font-size:18px;font-weight:800;letter-spacing:-0.3px;}
  .knb-nav{display:flex;gap:6px;flex-wrap:wrap;align-items:center;}
  .knb-nav button{background:transparent;border:1px solid rgba(255,255,255,0.25);color:#E7EEF8;padding:7px 13px;border-radius:7px;font-size:13px;font-weight:600;cursor:pointer;transition:all .15s;}
  .knb-nav button:hover{background:rgba(255,255,255,0.1);}
  .knb-nav button.active{background:var(--signal);border-color:var(--signal);color:#fff;}
  .knb-nav .knb-whoami{font-size:12px;color:#AFC2DE;margin-right:4px;}
  .knb-nav .knb-admin-pill{background:#3E2A0E;border-color:#FFB100;color:#FFD37A;}
  .knb-track-select{background:rgba(255,255,255,0.08);border:1px solid rgba(255,255,255,0.3);color:#fff;padding:6px 10px;border-radius:7px;font-size:12.5px;font-weight:700;}
  .knb-track-select option{color:#000;}

  .knb-body{max-width:880px;margin:0 auto;padding:28px 20px 60px;}
  .knb-body.knb-narrow{max-width:460px;}

  .knb-card{background:var(--card);border:1px solid var(--line);border-radius:var(--radius);padding:24px;margin-bottom:18px;}

  .knb-board{background:var(--board-bg);color:var(--board-amber);border-radius:var(--radius);padding:18px 22px;margin-bottom:22px;font-family:"SF Mono","Consolas",monospace;display:flex;justify-content:space-between;align-items:center;flex-wrap:wrap;gap:10px;}
  .knb-board-left{display:flex;flex-direction:column;gap:3px;}
  .knb-board-label{font-size:11px;letter-spacing:3px;opacity:.75;}
  .knb-board-val{font-size:22px;font-weight:700;letter-spacing:1px;}
  .knb-timer{font-size:30px;font-weight:800;letter-spacing:2px;}
  .knb-timer.warn{color:#FF5C4D;animation:blink 1s steps(2,start) infinite;}
  @keyframes blink{50%{opacity:.35;}}

  h2.knb-h{font-size:20px;font-weight:800;margin:0 0 6px;letter-spacing:-0.3px;}
  p.knb-sub{color:var(--ink-soft);font-size:13.5px;margin:0 0 18px;line-height:1.6;}

  .knb-grid2{display:grid;grid-template-columns:1fr 1fr;gap:14px;}
  .knb-grid3{display:grid;grid-template-columns:repeat(3,1fr);gap:14px;}
  @media (max-width:620px){.knb-grid2,.knb-grid3{grid-template-columns:1fr;}}

  .knb-mode-card{border:2px solid var(--line);border-radius:var(--radius);padding:20px;cursor:pointer;transition:all .15s;background:#fff;}
  .knb-mode-card:hover{border-color:var(--rail-blue-light);transform:translateY(-1px);}
  .knb-mode-card.selected{border-color:var(--rail-blue);background:#EAF0FA;}
  .knb-mode-card h3{margin:0 0 6px;font-size:16px;font-weight:800;}
  .knb-mode-card p{margin:0;font-size:12.5px;color:var(--ink-soft);line-height:1.6;}
  .knb-tag{display:inline-block;font-size:11px;font-weight:700;color:var(--rail-blue);background:#EAF0FA;padding:2px 8px;border-radius:5px;margin-bottom:8px;}
  .knb-tag.dept{color:#8A6416;background:#FFF3DC;}

  label.knb-label{display:block;font-size:12.5px;font-weight:700;color:var(--ink-soft);margin:14px 0 6px;}
  input[type=text],input[type=number],input[type=password],select,textarea{width:100%;padding:10px 12px;border:1px solid var(--line);border-radius:7px;font-size:14px;font-family:inherit;background:#fff;color:var(--ink);}
  textarea{resize:vertical;min-height:60px;}
  input[type=password]{letter-spacing:4px;font-weight:700;}

  .knb-btn{background:var(--rail-blue);color:#fff;border:none;padding:11px 20px;border-radius:8px;font-weight:700;font-size:14px;cursor:pointer;transition:background .15s;}
  .knb-btn:hover{background:var(--rail-navy);}
  .knb-btn.secondary{background:#fff;color:var(--rail-blue);border:1.5px solid var(--rail-blue);}
  .knb-btn.secondary:hover{background:#EAF0FA;}
  .knb-btn.danger{background:#fff;color:var(--bad);border:1.5px solid var(--bad);}
  .knb-btn.danger:hover{background:#FDECEA;}
  .knb-btn:disabled{opacity:.45;cursor:not-allowed;}
  .knb-btn.full{width:100%;}
  .knb-btn-row{display:flex;gap:10px;flex-wrap:wrap;margin-top:18px;}

  .knb-progress-wrap{display:flex;align-items:center;gap:10px;margin-bottom:18px;}
  .knb-progress-bar{flex:1;height:6px;background:var(--line);border-radius:4px;overflow:hidden;}
  .knb-progress-fill{height:100%;background:var(--signal);transition:width .2s;}
  .knb-progress-text{font-size:12.5px;color:var(--ink-soft);font-weight:700;white-space:nowrap;}

  .knb-qcat{display:inline-block;font-size:11px;font-weight:800;color:#fff;background:var(--rail-blue);padding:3px 9px;border-radius:5px;margin-bottom:10px;}
  .knb-qtext{font-size:16px;font-weight:700;line-height:1.6;margin-bottom:18px;white-space:pre-wrap;}
  .knb-choice{display:flex;align-items:flex-start;gap:10px;border:1.5px solid var(--line);border-radius:8px;padding:12px 14px;margin-bottom:9px;cursor:pointer;transition:all .12s;}
  .knb-choice:hover{border-color:var(--rail-blue-light);}
  .knb-choice.selected{border-color:var(--rail-blue);background:#EAF0FA;}
  .knb-choice-num{width:22px;height:22px;border-radius:50%;border:1.5px solid var(--ink-soft);display:flex;align-items:center;justify-content:center;font-size:12px;font-weight:700;flex-shrink:0;}
  .knb-choice.selected .knb-choice-num{background:var(--rail-blue);border-color:var(--rail-blue);color:#fff;}
  .knb-choice-text{font-size:14px;line-height:1.5;padding-top:1px;}

  .knb-jumpgrid{display:grid;grid-template-columns:repeat(10,1fr);gap:6px;margin-top:16px;}
  @media (max-width:620px){.knb-jumpgrid{grid-template-columns:repeat(6,1fr);}}
  .knb-jump{aspect-ratio:1;border-radius:6px;border:1px solid var(--line);background:#fff;font-size:11.5px;font-weight:700;cursor:pointer;color:var(--ink-soft);}
  .knb-jump.answered{background:#EAF0FA;color:var(--rail-blue);border-color:var(--rail-blue-light);}
  .knb-jump.current{outline:2px solid var(--signal);outline-offset:1px;}

  .knb-result-hero{background:var(--rail-navy);color:#fff;border-radius:var(--radius);padding:28px 24px;display:flex;justify-content:space-between;align-items:center;flex-wrap:wrap;gap:18px;margin-bottom:18px;}
  .knb-score-big{font-size:46px;font-weight:800;letter-spacing:-1px;}
  .knb-score-sub{font-size:13px;color:#AFC2DE;margin-top:4px;}
  .knb-catbars{display:flex;flex-direction:column;gap:10px;}
  .knb-catbar-row{display:flex;align-items:center;gap:10px;font-size:12.5px;}
  .knb-catbar-label{width:110px;flex-shrink:0;color:#D8E2F0;}
  .knb-catbar-track{flex:1;height:8px;background:rgba(255,255,255,0.15);border-radius:4px;overflow:hidden;}
  .knb-catbar-fill{height:100%;background:var(--board-amber);}
  .knb-catbar-num{width:48px;text-align:right;color:#fff;font-weight:700;}

  .knb-review-item{border:1px solid var(--line);border-radius:8px;padding:14px 16px;margin-bottom:10px;}
  .knb-review-item.wrong{border-left:4px solid var(--bad);}
  .knb-review-q{font-weight:700;font-size:14px;margin-bottom:6px;}
  .knb-review-ans{font-size:13px;color:var(--ink-soft);line-height:1.6;}
  .knb-review-ans b{color:var(--ink);}
  .knb-empty{text-align:center;padding:50px 20px;color:var(--ink-soft);}
  .knb-empty-mark{font-size:34px;margin-bottom:10px;}

  table.knb-table{width:100%;border-collapse:collapse;font-size:13px;}
  table.knb-table th,table.knb-table td{padding:9px 10px;border-bottom:1px solid var(--line);text-align:left;}
  table.knb-table th{color:var(--ink-soft);font-weight:700;font-size:12px;}

  .knb-qlist-item{display:flex;justify-content:space-between;align-items:flex-start;border:1px solid var(--line);border-radius:8px;padding:12px 14px;margin-bottom:8px;gap:12px;}
  .knb-qlist-meta{font-size:12px;color:var(--ink-soft);margin-bottom:4px;}
  .knb-qlist-text{font-size:13.5px;font-weight:600;}
  .knb-small{font-size:12px;padding:6px 10px;}

  .knb-banner{background:#FFF6E8;border:1px solid #F0D9A8;color:#8A6416;border-radius:8px;padding:10px 14px;font-size:12.5px;margin-bottom:18px;line-height:1.6;}
  .knb-error{background:#FDECEA;border:1px solid #F2B9B0;color:var(--bad);border-radius:8px;padding:10px 14px;font-size:12.5px;margin-bottom:14px;}

  .knb-login-tabs{display:flex;gap:8px;margin-bottom:18px;}
  .knb-login-tabs button{flex:1;padding:10px;border-radius:8px;border:1.5px solid var(--line);background:#fff;font-weight:700;font-size:13px;cursor:pointer;color:var(--ink-soft);}
  .knb-login-tabs button.active{border-color:var(--rail-blue);color:var(--rail-blue);background:#EAF0FA;}

  .knb-stat-grid{display:grid;grid-template-columns:repeat(3,1fr);gap:12px;margin-bottom:18px;}
  @media (max-width:620px){.knb-stat-grid{grid-template-columns:1fr;}}
  .knb-stat-box{background:#fff;border:1px solid var(--line);border-radius:8px;padding:16px;text-align:center;}
  .knb-stat-num{font-size:26px;font-weight:800;color:var(--rail-blue);}
  .knb-stat-label{font-size:12px;color:var(--ink-soft);margin-top:4px;}

  .knb-track-card{border:1.5px solid var(--line);border-radius:var(--radius);padding:18px;cursor:pointer;transition:all .15s;background:#fff;display:flex;flex-direction:column;gap:6px;}
  .knb-track-card:hover{border-color:var(--rail-blue-light);transform:translateY(-1px);}
  .knb-track-card h3{margin:0;font-size:15.5px;font-weight:800;}
  .knb-track-card p{margin:0;font-size:12px;color:var(--ink-soft);line-height:1.5;}
  .knb-cat-chip{display:inline-block;font-size:10.5px;background:#F0F3F8;color:var(--ink-soft);padding:2px 7px;border-radius:5px;margin:2px 4px 0 0;}

  .knb-dept-filter{display:flex;gap:6px;flex-wrap:wrap;margin-bottom:18px;}
  .knb-dept-filter button{padding:7px 13px;border-radius:7px;border:1.5px solid var(--line);background:#fff;font-size:12.5px;font-weight:700;cursor:pointer;color:var(--ink-soft);}
  .knb-dept-filter button.active{border-color:var(--rail-blue);color:#fff;background:var(--rail-blue);}
  .knb-dept-heading{font-size:13px;font-weight:800;color:var(--rail-blue);margin:20px 0 10px;text-transform:uppercase;letter-spacing:0.5px;}

  .knb-footer{max-width:880px;margin:0 auto;padding:18px 20px 36px;display:flex;align-items:center;justify-content:center;gap:10px;color:var(--ink-soft);font-size:12px;border-top:1px solid var(--line);}
  .knb-footer img{width:22px;height:22px;flex-shrink:0;}
  .knb-footer b{color:var(--ink);font-weight:700;}

  .knb-toast-wrap{position:fixed;top:18px;left:50%;transform:translateX(-50%);z-index:9999;display:flex;flex-direction:column;gap:8px;align-items:center;pointer-events:none;}
  .knb-toast{display:flex;align-items:center;gap:8px;background:var(--rail-navy);color:#fff;padding:11px 18px;border-radius:8px;font-size:13.5px;font-weight:600;box-shadow:0 6px 20px rgba(0,0,0,0.18);opacity:0;transform:translateY(-8px);transition:opacity .2s, transform .2s;}
  .knb-toast.show{opacity:1;transform:translateY(0);}
  .knb-toast.ok{background:var(--ok);}
  .knb-toast.err{background:var(--bad);}
  .knb-toast-icon{font-size:15px;}
</style>

<script>
(function(){
  const ADMIN_PASSWORD = "dush2100"; // 총괄 관리자 비밀번호. 필요시 코드에서 직접 변경하세요.
  const DEPARTMENTS = ["모빌리티과","전기배터리과","건축리모델링과","드론지형정보과"];
  const COMMON_DEPT = "공통";
  const TRACK_GROUPS = DEPARTMENTS.concat([COMMON_DEPT]); // 트랙(시험)에 적용 가능한 소속: 4개 학과 + 공통(한국사능력시험 등 전 학과 공용)

  function defaultTracks(){
    return [
      {
        id: "korail-ncs",
        dept: DEPARTMENTS[0],
        name: "코레일(한국철도공사) 고졸채용 NCS",
        categories: [
          {name:"의사소통능력", target:17},
          {name:"문제해결능력", target:17},
          {name:"수리능력", target:16},
          {name:"철도관계법령", target:10}
        ],
        examTotal: 60,
        examMinutes: 70
      }
    ];
  }

  let state = {
    screen: "login",
    loginTab: "student",
    student: null,        // 표시용 이름
    studentId: null,       // 5자리 학번 (고유키)
    studentDept: null,
    isAdmin: false,
    tracks: [],            // {id, dept, name, categories, examTotal, examMinutes}
    questions: [],         // {id, trackId, category, text, choices, answer, explanation}
    attempts: [],          // {id, trackId, studentId, student, dept, mode, category, total, correct, score, date}
    students: [],          // {studentId, name, dept, pin}
    currentTrackId: null,
    showOtherDeptTracks: false,
    adminTrackDept: null,   // 트랙관리 화면에서 선택 중인 학과
    adminDept: null,        // 문제관리 화면에서 선택 중인 학과
    adminTrackId: null,
    statsDept: "all",
    studentsDept: "all",
    quiz: null,
    timerHandle: null,
    lastResult: null,
    adminEdit: null,
    trackEdit: null,
    bulkImportOpen: false,
    bulkImportText: "",
    bulkImportResult: null,
    loginError: ""
  };

  function uid(){ return Math.random().toString(36).slice(2,9); }

  function showToast(message, type){
    const wrap = document.getElementById('knbToastWrap');
    if(!wrap) return;
    const t = el('div',{class:'knb-toast'+(type==='ok'?' ok':type==='err'?' err':'')},[
      el('span',{class:'knb-toast-icon'},[txt(type==='err'?'⚠':'✓')]),
      el('span',{},[txt(message)])
    ]);
    wrap.appendChild(t);
    requestAnimationFrame(()=>{ t.classList.add('show'); });
    setTimeout(()=>{
      t.classList.remove('show');
      setTimeout(()=>{ t.remove(); }, 250);
    }, 2400);
  }

  // 버튼 클릭 즉시 로딩 상태로 바꾸고, 처리가 끝나면 render()가 화면을 다시 그리며 버튼도 새로 생성되므로
  // 별도 복구 로직 없이도 자연스럽게 원래 상태로 돌아온다.
  function withLoading(btn, loadingText, fn){
    return async (...args)=>{
      if(btn.disabled) return;
      const original = btn.textContent;
      btn.disabled = true;
      btn.textContent = loadingText;
      try{
        await fn(...args);
      } finally {
        // fn 내부에서 render()가 호출되지 않는 예외 상황 대비, 버튼이 여전히 DOM에 남아있다면 복구
        if(document.body.contains(btn) && btn.textContent===loadingText){
          btn.disabled = false;
          btn.textContent = original;
        }
      }
    };
  }

  function getTrack(id){ return state.tracks.find(t=>t.id===id); }
  function trackCats(track){ return track.categories.map(c=>c.name); }
  function trackDeptOf(trackId){ const t = getTrack(trackId); return t ? t.dept : null; }

  function sampleQuestionsForTrack(track){
    return track.categories.map(c=>({
      id: uid(), trackId: track.id, category: c.name,
      text: "(샘플) "+c.name+" 영역 예시 문제입니다.\n\n※ 실제 문제로 교체 예정입니다.",
      choices: ["선택지 1","선택지 2","선택지 3","선택지 4"], answer: 0,
      explanation: "샘플 문제입니다. 관리자 모드의 문제 관리 탭에서 실제 문항으로 교체/추가하세요."
    }));
  }

  async function loadData(){
    try{
      const t = await window.storage.get('tracks', true);
      state.tracks = t ? JSON.parse(t.value) : defaultTracks();
      if(!t){ await window.storage.set('tracks', JSON.stringify(state.tracks), true); }
    }catch(e){ state.tracks = defaultTracks(); }

    try{
      const q = await window.storage.get('questions', true);

    return false;
  }

  function startExam(){

    if(items.length===0){ alert("등록된 문제가 없습니다. 관리자에게 문제 등록을 요청해 주세요."); return; }
    const deadline = Date.now() + track.examMinutes*60*1000;
    state.quiz = {trackId: track.id, mode:"exam", category:null, items, answers:{}, idx:0, startedAt:Date.now(), deadline};
    setScreen("quiz");
    startTimer();
  }

  function pickExamItems(track){
    let pool = [];
    track.categories.forEach(c=>{
      const have = state.questions.filter(q=>q.trackId===track.id && q.category===c.name);
      const shuffled = shuffle(have.slice());
      pool = pool.concat(shuffled.slice(0, c.target));
    });
    if(pool.length < track.examTotal){
      const usedIds = new Set(pool.map(p=>p.id));
      const rest = shuffle(state.questions.filter(q=>q.trackId===track.id && !usedIds.has(q.id)));
      pool = pool.concat(rest.slice(0, track.examTotal-pool.length));
    }
    return shuffle(pool).slice(0, Math.min(track.examTotal,pool.length));
  }

  function shuffle(arr){
    for(let i=arr.length-1;i>0;i--){ const j = Math.floor(Math.random()*(i+1)); [arr[i],arr[j]]=[arr[j],arr[i]]; }
    return arr;
  }

  function startPractice(category, count){
    const track = getTrack(state.currentTrackId);
    const have = shuffle(state.questions.filter(q=>q.trackId===track.id && q.category===category));
    if(have.length===0){ alert(category+" 영역에 등록된 문제가 없습니다."); return; }
    const items = have.slice(0, Math.min(count, have.length));
    state.quiz = {trackId: track.id, mode:"practice", category, items, answers:{}, idx:0, startedAt:Date.now(), deadline:null};
    setScreen("quiz");
  }

  function startTimer(){
    stopTimer();
    state.timerHandle = setInterval(()=>{
      if(!state.quiz || !state.quiz.deadline) return;
      const remain = state.quiz.deadline - Date.now();
      if(remain<=0){ stopTimer(); finishQuiz(true); return; }
      const el2 = document.getElementById('knbTimerVal');
      if(el2) el2.textContent = fmtTime(remain);
      const wrap = document.getElementById('knbTimerBox');
      if(wrap) wrap.classList.toggle('warn', remain < 5*60*1000);
    }, 1000);
  }
  function stopTimer(){ if(state.timerHandle){ clearInterval(state.timerHandle); state.timerHandle=null; } }

  function fmtTime(ms){
    const total = Math.max(0,Math.floor(ms/1000));
    const m = Math.floor(total/60).toString().padStart(2,'0');
    const s = (total%60).toString().padStart(2,'0');
    return m+":"+s;
  }

  function selectChoice(qid, choiceIdx){ state.quiz.answers[qid] = choiceIdx; render(); }

  function finishQuiz(auto){
    stopTimer();
    const q = state.quiz;
    let correct = 0;
    const catStats = {};
    const wrongList = [];
    q.items.forEach(item=>{
      const given = q.answers[item.id];
      const isRight = given===item.answer;
      if(isRight) correct++;
      catStats[item.category] = catStats[item.category] || {total:0, correct:0};
      catStats[item.category].total++;
      if(isRight) catStats[item.category].correct++;
      if(!isRight) wrongList.push({...item, given});
    });
    const result = {
      id: uid(), trackId: q.trackId, studentId: state.studentId, student: state.student, dept: state.studentDept,
      mode: q.mode, category: q.category,
      total: q.items.length, correct, score: Math.round((correct/q.items.length)*100),
      date: new Date().toISOString(), auto: !!auto, catStats, wrongList
    };
    state.attempts.push({
      id: result.id, trackId: result.trackId, studentId: result.studentId, student: result.student, dept: result.dept,
      mode: result.mode, category: result.category,
      total: result.total, correct: result.correct, score: result.score, date: result.date
    });
    saveAttempts();
    state.lastResult = result;
    state.quiz = null;
    setScreen("result");
  }

  // ---------- 일괄 가져오기 ----------
  async function runBulkImport(){
    const track = getTrack(state.adminTrackId);
    const cats = trackCats(track);
    const lines = state.bulkImportText.split('\n').map(l=>l.trim()).filter(l=>l && !l.startsWith('#'));
    const added = [];
    const errors = [];
    lines.forEach((line, idx)=>{
      const parts = line.split('|').map(p=>p.trim());
      if(parts.length < 7){ errors.push((idx+1)+'번째 줄: 항목이 7개 미만입니다 (영역|문제|선택지1|선택지2|선택지3|선택지4|정답번호 필요)'); return; }
      const [category, text, c1,c2,c3,c4, answerRaw, explanation] = parts;
      if(!cats.includes(category)){ errors.push((idx+1)+'번째 줄: 영역명이 올바르지 않습니다 ("'+category+'"). 이 트랙의 영역: '+cats.join(', ')); return; }
      const answerNum = parseInt(answerRaw, 10);
      if(!(answerNum>=1 && answerNum<=4)){ errors.push((idx+1)+'번째 줄: 정답번호는 1~4 사이여야 합니다.'); return; }
      if(!text || !c1 || !c2 || !c3 || !c4){ errors.push((idx+1)+'번째 줄: 문제 또는 선택지가 비어 있습니다.'); return; }
      added.push({id:uid(), trackId: track.id, category, text, choices:[c1,c2,c3,c4], answer:answerNum-1, explanation: explanation||""});
    });
    if(added.length>0){ state.questions = state.questions.concat(added); await saveQuestions(); }
    state.bulkImportResult = {addedCount: added.length, errors};
    render();
    if(added.length>0) showToast(added.length+'개의 문제가 등록되었습니다.', 'ok');
    else if(errors.length>0) showToast('등록된 문제가 없습니다. 형식을 확인해 주세요.', 'err');
  }

  function el(tag, attrs, children){
    const e = document.createElement(tag);
    if(attrs) Object.entries(attrs).forEach(([k,v])=>{
      if(k==='class') e.className=v;
      else if(k==='html') e.innerHTML=v;
      else if(k.startsWith('on')) e[k]=v;
      else e.setAttribute(k,v);
    });
    (children||[]).forEach(c=> e.appendChild(c));
    return e;
  }

  function renderQuiz(){
    const q = state.quiz;
    const track = getTrack(q.trackId);
    const wrap = document.createDocumentFragment();
    const item = q.items[q.idx];

    const board = el('div',{class:'knb-board'});
    board.appendChild(el('div',{class:'knb-board-left'},[
      el('span',{class:'knb-board-label'},[txt(track.dept+' · '+track.name+' · '+(q.mode==='exam' ? '실전모의고사':'영역별 연습 · '+q.category))]),
      el('span',{class:'knb-board-val'},[txt(state.student)])
    ]));
    if(q.deadline){
      const tBox = el('div',{id:'knbTimerBox'});
      tBox.appendChild(el('div',{class:'knb-board-label'},[txt('남은 시간')]));
      tBox.appendChild(el('div',{class:'knb-timer',id:'knbTimerVal'},[txt(fmtTime(q.deadline-Date.now()))]));
      board.appendChild(tBox);
    }
    wrap.appendChild(board);

    const answeredCount = Object.keys(q.answers).length;
    const progWrap = el('div',{class:'knb-progress-wrap'});
    progWrap.appendChild(el('div',{class:'knb-progress-bar'},[el('div',{class:'knb-progress-fill', style:'width:'+Math.round(answeredCount/q.items.length*100)+'%'})]));
    progWrap.appendChild(el('div',{class:'knb-progress-text'},[txt((q.idx+1)+' / '+q.items.length+' 문항 · 응답 '+answeredCount+'개')]));
    wrap.appendChild(progWrap);

    const card = el('div',{class:'knb-card'});
    card.appendChild(el('span',{class:'knb-qcat'},[txt(item.category)]));
    card.appendChild(el('div',{class:'knb-qtext'},[txt((q.idx+1)+'. '+item.text)]));
    item.choices.forEach((c,i)=>{
      const sel = q.answers[item.id]===i;
      const choice = el('div',{class:'knb-choice'+(sel?' selected':'')});
      choice.appendChild(el('div',{class:'knb-choice-num'},[txt(String(i+1))]));
      choice.appendChild(el('div',{class:'knb-choice-text'},[txt(c)]));
      choice.onclick = ()=>selectChoice(item.id, i);
      card.appendChild(choice);
    });

    const btnRow = el('div',{class:'knb-btn-row'});
    const prevBtn = el('button',{class:'knb-btn secondary'},[txt('이전')]);
    prevBtn.disabled = q.idx===0;
    prevBtn.onclick = ()=>{ q.idx = Math.max(0,q.idx-1); render(); };
    btnRow.appendChild(prevBtn);
    if(q.idx < q.items.length-1){
      const nextBtn = el('button',{class:'knb-btn'},[txt('다음')]);
      nextBtn.onclick = ()=>{ q.idx = Math.min(q.items.length-1, q.idx+1); render(); };
      btnRow.appendChild(nextBtn);
    }
    const submitBtn = el('button',{class:'knb-btn'},[txt('제출하고 채점')]);
    submitBtn.style.background = 'var(--signal)';
    submitBtn.onclick = ()=>{
      if(answeredCount < q.items.length){
        if(!confirm('아직 풀지 않은 문항이 '+(q.items.length-answeredCount)+'개 있습니다. 제출할까요?')) return;
      }
      finishQuiz(false);
    };
    btnRow.appendChild(submitBtn);
    card.appendChild(btnRow);
    wrap.appendChild(card);

    const jump = el('div',{class:'knb-jumpgrid'});
    q.items.forEach((it,i)=>{
      const b = el('button',{class:'knb-jump'+(q.answers[it.id]!==undefined?' answered':'')+(i===q.idx?' current':'')},[txt(String(i+1))]);
      b.onclick = ()=>{ q.idx = i; render(); };
      jump.appendChild(b);
    });
    wrap.appendChild(jump);
    return wrap;
  }

    } else {

      statGrid.appendChild(el('div',{class:'knb-stat-box'},[el('div',{class:'knb-stat-num'},[txt(mine.length)]), el('div',{class:'knb-stat-label'},[txt('총 응시 횟수')])]));

      statGrid.appendChild(el('div',{class:'knb-stat-box'},[el('div',{class:'knb-stat-num'},[txt(mine[0].score+'점')]), el('div',{class:'knb-stat-label'},[txt('최근 점수')])]));
      card.appendChild(statGrid);

      const table = el('table',{class:'knb-table'});
      table.appendChild(el('thead',{},[el('tr',{},[el('th',{},[txt('일시')]), el('th',{},[txt('시험')]), el('th',{},[txt('구분')]), el('th',{},[txt('점수')]), el('th',{},[txt('정답수')])])]));
      const tbody = el('tbody',{});
      mine.forEach(a=>{
        const d = new Date(a.date);
        const dateStr = d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0')+'-'+String(d.getDate()).padStart(2,'0')+' '+String(d.getHours()).padStart(2,'0')+':'+String(d.getMinutes()).padStart(2,'0');
        const modeStr = a.mode==='exam' ? '실전모의고사' : ('연습 · '+a.category);
        const t = getTrack(a.trackId);
        const tname = t ? ('['+t.dept+'] '+t.name) : '(삭제된 트랙)';
        tbody.appendChild(el('tr',{},[el('td',{},[txt(dateStr)]), el('td',{},[txt(tname)]), el('td',{},[txt(modeStr)]), el('td',{},[txt(a.score+'점')]), el('td',{},[txt(a.correct+'/'+a.total)])]));
      });
      table.appendChild(tbody);
      card.appendChild(table);
    }
    wrap.appendChild(card);
    return wrap;
  }

    const sBody = el('tbody',{});
    Object.entries(byStudent).sort((a,b)=>{
      const avgA = a[1].scores.reduce((s,v)=>s+v,0)/a[1].scores.length;
      const avgB = b[1].scores.reduce((s,v)=>s+v,0)/b[1].scores.length;
      return avgB-avgA;
    }).forEach(([sid,info])=>{
      const avg = Math.round(info.scores.reduce((s,v)=>s+v,0)/info.scores.length);
      sBody.appendChild(el('tr',{},[el('td',{},[txt(sid)]), el('td',{},[txt(info.name)]), el('td',{},[txt(info.dept)]), el('td',{},[txt(String(info.scores.length))]), el('td',{},[txt(avg+'점')])]));
    });
    sTable.appendChild(sBody);
    card.appendChild(sTable);
    wrap.appendChild(card);

    const listCard = el('div',{class:'knb-card'});
    listCard.appendChild(el('h2',{class:'knb-h'},[txt('전체 응시 기록')]));
    const table = el('table',{class:'knb-table'});
    table.appendChild(el('thead',{},[el('tr',{},[el('th',{},[txt('일시')]), el('th',{},[txt('트랙')]), el('th',{},[txt('학번')]), el('th',{},[txt('응시자')]), el('th',{},[txt('구분')]), el('th',{},[txt('점수')]), el('th',{},[txt('정답수')])])]));
    const tbody = el('tbody',{});
    filtered.slice().reverse().forEach(a=>{
      const d = new Date(a.date);
      const dateStr = d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0')+'-'+String(d.getDate()).padStart(2,'0')+' '+String(d.getHours()).padStart(2,'0')+':'+String(d.getMinutes()).padStart(2,'0');
      const modeStr = a.mode==='exam' ? '실전모의고사' : ('연습 · '+a.category);
      const t = getTrack(a.trackId);
      const tname = t ? ('['+t.dept+'] '+t.name) : '(삭제된 트랙)';
      tbody.appendChild(el('tr',{},[el('td',{},[txt(dateStr)]), el('td',{},[txt(tname)]), el('td',{},[txt(a.studentId||'-')]), el('td',{},[txt(a.student)]), el('td',{},[txt(modeStr)]), el('td',{},[txt(a.score+'점')]), el('td',{},[txt(a.correct+'/'+a.total)])]));
    });
    table.appendChild(tbody);
    listCard.appendChild(table);
    wrap.appendChild(listCard);
    return wrap;
  }

  loadData();
})();
</script>

</body></html>
